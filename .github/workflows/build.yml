name: Build All Platforms

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: btc_wallet_gui_macos_intel
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: btc_wallet_gui_macos_arm64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: btc_wallet_gui_windows_x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: btc_wallet_gui_linux_x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install cargo-packager
      run: cargo install cargo-packager

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: cargo packager --release --formats appimage

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: cargo packager --release --formats app

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: cargo packager --release --formats nsis

    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.AppImage

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.app

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/*-setup.exe

  create-universal-macos:
    name: Create macOS Universal Binary
    needs: build
    runs-on: macos-latest
    
    steps:
    - name: Download Intel binary
      uses: actions/download-artifact@v4
      with:
        name: btc_wallet_gui_macos_intel
        path: intel_artifact

    - name: Download ARM64 binary
      uses: actions/download-artifact@v4
      with:
        name: btc_wallet_gui_macos_arm64
        path: arm64_artifact

    - name: Debug - List artifact contents
      run: |
        echo "=== Intel artifact contents ==="
        ls -la intel_artifact/
        find intel_artifact -name "*.app" -type d
        echo ""
        echo "=== ARM64 artifact contents ==="
        ls -la arm64_artifact/
        find arm64_artifact -name "*.app" -type d

    - name: Extract binaries
      run: |
        set -e
        
        # Extract Intel binary
        cd intel_artifact
        INTEL_APP=$(find . -name "*.app" -type d | head -1)
        if [ -z "$INTEL_APP" ]; then
          echo "Error: No .app bundle found in Intel artifact"
          exit 1
        fi
        
        # Get the executable name from inside the .app bundle
        APP_BASENAME=$(basename "$INTEL_APP" .app)
        EXECUTABLE_PATH="${INTEL_APP}/Contents/MacOS/${APP_BASENAME}"
        
        # If executable not found with app name, try to find any executable
        if [ ! -f "$EXECUTABLE_PATH" ]; then
          EXECUTABLE_PATH=$(find "${INTEL_APP}/Contents/MacOS" -type f | head -1)
        fi
        
        if [ -z "$EXECUTABLE_PATH" ] || [ ! -f "$EXECUTABLE_PATH" ]; then
          echo "Error: No executable found in Intel .app bundle"
          exit 1
        fi
        
        cp "$EXECUTABLE_PATH" ../btc_wallet_gui_intel
        cd ..
        
        # Extract ARM64 binary
        cd arm64_artifact
        ARM64_APP=$(find . -name "*.app" -type d | head -1)
        if [ -z "$ARM64_APP" ]; then
          echo "Error: No .app bundle found in ARM64 artifact"
          exit 1
        fi
        
        # Get the executable name from inside the .app bundle
        APP_BASENAME=$(basename "$ARM64_APP" .app)
        EXECUTABLE_PATH="${ARM64_APP}/Contents/MacOS/${APP_BASENAME}"
        
        # If executable not found with app name, try to find any executable
        if [ ! -f "$EXECUTABLE_PATH" ]; then
          EXECUTABLE_PATH=$(find "${ARM64_APP}/Contents/MacOS" -type f | head -1)
        fi
        
        if [ -z "$EXECUTABLE_PATH" ] || [ ! -f "$EXECUTABLE_PATH" ]; then
          echo "Error: No executable found in ARM64 .app bundle"
          exit 1
        fi
        
        cp "$EXECUTABLE_PATH" ../btc_wallet_gui_arm64
        cd ..
        
        # Make binaries executable
        chmod +x btc_wallet_gui_intel btc_wallet_gui_arm64
        
        echo "Successfully extracted binaries:"
        ls -la btc_wallet_gui_intel btc_wallet_gui_arm64
        file btc_wallet_gui_intel btc_wallet_gui_arm64

    - name: Create universal binary
      run: |
        set -e
        
        if [ ! -f btc_wallet_gui_intel ] || [ ! -f btc_wallet_gui_arm64 ]; then
          echo "Error: Binary files not found"
          exit 1
        fi
        
        lipo -create \
          btc_wallet_gui_intel \
          btc_wallet_gui_arm64 \
          -output btc_wallet_gui_macos_universal
        
        chmod +x btc_wallet_gui_macos_universal
        
        echo "Universal binary created:"
        file btc_wallet_gui_macos_universal
        lipo -info btc_wallet_gui_macos_universal
        
        tar -czf btc_wallet_gui_macos_universal.tar.gz btc_wallet_gui_macos_universal

    - name: Upload universal binary
      uses: actions/upload-artifact@v4
      with:
        name: btc_wallet_gui_macos_universal
        path: btc_wallet_gui_macos_universal.tar.gz
