name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: btc_wallet_gui_macos_intel
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: btc_wallet_gui_macos_arm64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: btc_wallet_gui_windows_x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: btc_wallet_gui_linux_x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install cargo-packager
      run: cargo install cargo-packager

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: cargo packager --release --formats appimage

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: cargo packager --release --formats app

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: cargo packager --release --formats nsis

    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.AppImage

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.app

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/*-setup.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: |
        echo "=== Artifacts directory structure ==="
        ls -laR artifacts/

    - name: Prepare release files
      run: |
        mkdir -p release_files
        
        # Copy macOS Intel app
        if [ -d "artifacts/btc_wallet_gui_macos_intel" ]; then
          cp -r artifacts/btc_wallet_gui_macos_intel/*.app release_files/ 2>/dev/null || true
        fi
        
        # Copy macOS ARM64 app
        if [ -d "artifacts/btc_wallet_gui_macos_arm64" ]; then
          cp -r artifacts/btc_wallet_gui_macos_arm64/*.app release_files/ 2>/dev/null || true
        fi
        
        # Copy Windows installer
        if [ -d "artifacts/btc_wallet_gui_windows_x64" ]; then
          cp artifacts/btc_wallet_gui_windows_x64/*-setup.exe release_files/ 2>/dev/null || true
        fi
        
        # Copy Linux AppImage
        if [ -d "artifacts/btc_wallet_gui_linux_x64" ]; then
          cp artifacts/btc_wallet_gui_linux_x64/*.AppImage release_files/ 2>/dev/null || true
        fi
        
        echo "=== Files prepared for release ==="
        ls -la release_files/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Bitcoin Wallet ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release_files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}