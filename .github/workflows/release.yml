name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: btc_wallet_gui_macos_intel
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: btc_wallet_gui_macos_arm64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: btc_wallet_gui_windows_x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: btc_wallet_gui_linux_x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install cargo-packager
      run: cargo install cargo-packager

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: cargo packager --release --formats appimage

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: cargo packager --release --formats app

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: cargo packager --release --formats exe

    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.AppImage

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.app

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/btc_wallet_gui

  create-universal-macos:
    name: Create macOS Universal Binary
    needs: build
    runs-on: macos-latest
    
    steps:
    - name: Download Intel binary
      uses: actions/download-artifact@v4
      with:
        name: btc_wallet_gui_macos_intel

    - name: Download ARM64 binary
      uses: actions/download-artifact@v4
      with:
        name: btc_wallet_gui_macos_arm64

    - name: Extract binaries
      run: |
        # Navigate into downloaded artifact directories and extract the actual binaries
        # The artifacts are directories containing .app bundles
        cd btc_wallet_gui_macos_intel
        # Find the .app bundle and extract the executable from Contents/MacOS/
        APP_NAME=$(find . -name "*.app" -type d | head -1 | xargs basename)
        cp "${APP_NAME}/Contents/MacOS/${APP_NAME%.app}" ../btc_wallet_gui_intel
        cd ..
        
        cd btc_wallet_gui_macos_arm64
        # Find the .app bundle and extract the executable from Contents/MacOS/
        APP_NAME=$(find . -name "*.app" -type d | head -1 | xargs basename)
        cp "${APP_NAME}/Contents/MacOS/${APP_NAME%.app}" ../btc_wallet_gui_arm64
        cd ..
        
        # Make binaries executable
        chmod +x btc_wallet_gui_intel btc_wallet_gui_arm64

    - name: Create universal binary
      run: |
        lipo -create \
          btc_wallet_gui_intel \
          btc_wallet_gui_arm64 \
          -output btc_wallet_gui_macos_universal
        chmod +x btc_wallet_gui_macos_universal
        tar -czf btc_wallet_gui_macos_universal.tar.gz btc_wallet_gui_macos_universal

    - name: Upload universal binary
      uses: actions/upload-artifact@v4
      with:
        name: btc_wallet_gui_macos_universal
        path: btc_wallet_gui_macos_universal.tar.gz

  release:
    name: Create Release
    needs: [build, create-universal-macos]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/btc_wallet_gui_macos_intel/*.app
          artifacts/btc_wallet_gui_macos_arm64/*.app
          artifacts/btc_wallet_gui_macos_universal/btc_wallet_gui_macos_universal.tar.gz
          artifacts/btc_wallet_gui_windows_x64/btc_wallet_gui
          artifacts/btc_wallet_gui_linux_x64/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}