name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: btc_wallet_gui_macos_intel
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: btc_wallet_gui_macos_arm64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: btc_wallet_gui_windows_x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: btc_wallet_gui_linux_x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install cargo-packager
      run: cargo install cargo-packager

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: cargo packager --release --formats appimage

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: cargo packager --release --formats app

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: cargo packager --release --formats nsis

    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.AppImage

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/**/*.app

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          target/release/*-setup.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release_files
        
        # macOS Intel: zip .app bundle
        if [ -d "artifacts/btc_wallet_gui_macos_intel" ]; then
          APP_PATH=$(find artifacts/btc_wallet_gui_macos_intel -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            ZIP_NAME="${APP_NAME}_macOS_Intel.app.zip"
            (cd "$(dirname "$APP_PATH")" && zip -r -9 "$OLDPWD/release_files/$ZIP_NAME" "$(basename "$APP_PATH")")
            echo "Zipped macOS Intel: $ZIP_NAME"
          else
            echo "Warning: No .app found for macOS Intel"
          fi
        fi
        
        # macOS ARM64: zip .app bundle
        if [ -d "artifacts/btc_wallet_gui_macos_arm64" ]; then
          APP_PATH=$(find artifacts/btc_wallet_gui_macos_arm64 -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            ZIP_NAME="${APP_NAME}_macOS_ARM64.app.zip"
            (cd "$(dirname "$APP_PATH")" && zip -r -9 "$OLDPWD/release_files/$ZIP_NAME" "$(basename "$APP_PATH")")
            echo "Zipped macOS ARM64: $ZIP_NAME"
          else
            echo "Warning: No .app found for macOS ARM64"
          fi
        fi
        
        # Windows: copy installer with platform suffix
        if [ -d "artifacts/btc_wallet_gui_windows_x64" ]; then
          find artifacts/btc_wallet_gui_windows_x64 -name "*-setup.exe" | while read exe; do
            EXE_NAME=$(basename "$exe")
            NEW_NAME="${EXE_NAME/-setup.exe/_Windows_x64-setup.exe}"
            cp "$exe" "release_files/$NEW_NAME"
            echo "Copied: $NEW_NAME"
          done
        fi
        
        # Linux: copy AppImage with platform suffix
        if [ -d "artifacts/btc_wallet_gui_linux_x64" ]; then
          find artifacts/btc_wallet_gui_linux_x64 -name "*.AppImage" | while read appimage; do
            APPIMAGE_NAME=$(basename "$appimage")
            NEW_NAME="${APPIMAGE_NAME/.AppImage/_Linux_x64.AppImage}"
            cp "$appimage" "release_files/$NEW_NAME"
            echo "Copied: $NEW_NAME"
          done
        fi
        
        echo "=== Release files prepared ==="
        ls -la release_files/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Bitcoin Wallet ${{ steps.tag.outputs.tag }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release_files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}