[package]
name = "btc_wallet_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "advanced", "image"] }
iced_aw = { version = "0.12", default-features = false }
iced_fonts = { version = "0.1", features = ["bootstrap"] }
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
bip39 = { version = "2.1", features = ["rand", "serde"] }
bitcoin = { version = "0.32", features = ["serde"] }
chacha20poly1305 = "0.10"
chrono = "0.4"
directories = "5.0"
getrandom = "0.3"
rand = "0.9"
qrcode = "0.14"
printpdf = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sssmc39 = "0.0.3"
tokio = { version = "1", features = ["full"] }
zeroize = "1"

[profile.release]
codegen-units = 1  # Tắt biên dịch song song để tối ưu tốt hơn
lto = "fat"  
strip = true  # Loại bỏ symbol dư thừa để file thực thi gọn nhẹ hơn
panic = 'abort'

[package.metadata.packager]
name = "Bitcoin Wallet"
identifier = "com.btcwallet.gui"
icons = ["icons/icon.icns", "icons/icon.png"]
resources = ["btc_wallet_gui.desktop"]
copyright = "Copyright (c) 2026"
category = "Finance"
description = "Bitcoin Wallet GUI"
long_description = """
Desktop Bitcoin wallet with mnemonic backup and SLIP-0039 support.
Supports multiple wallets, send/receive BTC, and transaction history.
"""
before-packaging-command = "cargo build --release"  # ← Thêm dòng này
